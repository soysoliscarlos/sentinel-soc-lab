---
- name: Install Apache and PostgreSQL on Ubuntu
  hosts: linux
  become: true
  gather_facts: true
  tasks:
    - name: Verify supported OS platform
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == 'Ubuntu'
          - ansible_facts.distribution_version == '22.04'
        fail_msg: This playbook requires Ubuntu 22.04 as declared in Terraform.

    - name: Wait for cloud-init to finish
      ansible.builtin.command: cloud-init status --wait
      changed_when: false
      when: not ansible_check_mode

    - name: Install packages and ACL support for tasks running as postgres
      ansible.builtin.apt:
        name:
          - apache2
          - postgresql
          - postgresql-client
          - acl
        state: present
        update_cache: true
        cache_valid_time: 3600
        lock_timeout: 300

    - name: Enable and start Apache and PostgreSQL
      ansible.builtin.service:
        name: "{{ item }}"
        enabled: true
        state: started
      loop:
        - apache2
        - postgresql

    - name: Query PostgreSQL cluster configuration file path
      ansible.builtin.command:
        argv: [psql, -At, -c, SHOW config_file]
      become_user: postgres
      register: pg_config
      changed_when: false
      when: not ansible_check_mode

    - name: Restrict PostgreSQL to local connections only
      ansible.builtin.lineinfile:
        path: "{{ pg_config.stdout | trim }}"
        regexp: "^#?listen_addresses\\s*="
        line: "listen_addresses = 'localhost'"
      notify: Restart PostgreSQL
      when: not ansible_check_mode

    - name: Flush handlers before verification
      ansible.builtin.meta: flush_handlers

    - name: Verify Apache locally
      ansible.builtin.uri:
        url: http://127.0.0.1/
        status_code: 200
      when: not ansible_check_mode

    - name: Verify PostgreSQL is accepting connections
      ansible.builtin.command: pg_isready
      become_user: postgres
      changed_when: false
      when: not ansible_check_mode

    - name: Verify active PostgreSQL listen_addresses
      ansible.builtin.command:
        argv: [psql, -At, -c, SHOW listen_addresses]
      become_user: postgres
      register: pg_listen
      changed_when: false
      failed_when: pg_listen.rc != 0 or pg_listen.stdout | trim != 'localhost'
      when: not ansible_check_mode

    - name: Configure service logs after installing and verifying Linux services
      ansible.builtin.import_tasks: linux-logging.yml

  handlers:
    - name: Restart PostgreSQL
      ansible.builtin.service:
        name: postgresql
        state: restarted

    - name: Reload Apache
      ansible.builtin.service:
        name: apache2
        state: reloaded

    - name: Restart rsyslog
      ansible.builtin.service:
        name: rsyslog
        state: restarted

- name: Install IIS and promote the lab Domain Controller
  hosts: windows
  gather_facts: false
  become: true
  become_method: runas
  become_user: SYSTEM
  tasks:
    - name: Wait for Windows SSH connectivity
      ansible.builtin.wait_for_connection:
        timeout: 600

    - name: Install IIS, HTTP logging, and AD DS features with management tools
      ansible.windows.win_feature:
        name:
          - Web-Server
          - Web-Http-Logging
          - AD-Domain-Services
        include_management_tools: true
        state: present
      register: windows_features

    - name: Reboot if required by Windows features
      ansible.windows.win_reboot:
        reboot_timeout: 1200
      when: windows_features.reboot_required

    - name: Create AD forest and reboot when required
      microsoft.ad.domain:
        dns_domain_name: "{{ lab_domain_name }}"
        domain_netbios_name: "{{ lab_domain_netbios }}"
        safe_mode_password: "{{ lookup('ansible.builtin.env', 'SOC_DSRM_PASSWORD') }}"
        install_dns: true
        reboot: true
        reboot_timeout: 1200

    - name: Enable and start IIS service
      ansible.windows.win_service:
        name: W3SVC
        state: started
        start_mode: auto

    - name: Allow inbound HTTP in Windows Firewall
      community.windows.win_firewall_rule:
        name: SOC Lab IIS HTTP
        localport: '80'
        protocol: tcp
        direction: in
        action: allow
        enabled: true
        state: present

    - name: Verify IIS locally
      ansible.windows.win_uri:
        url: http://127.0.0.1/
        status_code: 200
      when: not ansible_check_mode

    - name: Verify AD domain, core services, and DNS SRV record
      ansible.windows.win_powershell:
        script: |
          $Ansible.Changed = $false
          $domain = Get-ADDomain -ErrorAction Stop
          if ($domain.DNSRoot -ne '{{ lab_domain_name }}') {
              throw 'Created AD domain does not match requested domain name.'
          }
          foreach ($name in @('NTDS', 'DNS', 'Netlogon', 'W3SVC')) {
              if ((Get-Service $name -ErrorAction Stop).Status -ne 'Running') {
                  throw "Service $name is not running."
              }
          }
          Resolve-DnsName -Name '_ldap._tcp.dc._msdcs.{{ lab_domain_name }}' -Type SRV -ErrorAction Stop
      when: not ansible_check_mode

    - name: Configure IIS and AD DS logs after domain promotion
      ansible.windows.win_powershell:
        script: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/files/Configure-ServiceLogging.ps1') }}"

    - name: Verify HTTP after enabling IIS logging
      ansible.windows.win_uri:
        url: http://127.0.0.1/
        status_code: 200
      when: not ansible_check_mode
