# imfile persists read offsets to resume cleanly across service restarts and log rotations.
module(load="imfile")
input(type="imfile"
      File="/var/log/apache2/access.log"
      Tag="apache-access:"
      Facility="local6"
      Severity="info"
      PersistStateInterval="100")
input(type="imfile"
      File="/var/log/apache2/error.log"
      Tag="apache-error:"
      Facility="local6"
      Severity="error"
      PersistStateInterval="100")
