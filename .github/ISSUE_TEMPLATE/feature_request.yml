name: Feature Request
description: Propose a new feature, Sentinel analytic rule, Azure resource, notebook, or telemetry integration.
title: "[FEAT]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for sharing ideas to evolve the Azure SOC Level 2 Cyber Range!
  - type: textarea
    id: problem_statement
    attributes:
      label: What use case or defensive gap does this request address?
      description: Describe the detection scenario, telemetry source, or capability needed.
      placeholder: "Currently there is no scheduled analytic rule to detect lateral movement via Pass-the-Hash..."
    validations:
      required: true
  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed Solution / Implementation
      description: Explain how you envision implementing it (Terraform resources, KQL rule, Ansible task, Sentinel playbook, etc.).
    validations:
      required: true
  - type: textarea
    id: alternatives_considered
    attributes:
      label: Alternatives Considered
      description: Have you evaluated alternative approaches or workarounds?
    validations:
      required: false
  - type: dropdown
    id: component_affected
    attributes:
      label: Primary Component Affected
      options:
        - Microsoft Sentinel (Analytic rules, Hunting queries, Playbooks, Workbooks, Notebooks)
        - Compute & Virtual Machines (Windows / Linux)
        - Networking & Security (VNet, NSG, Key Vault, Defender)
        - Containers & App Services (AKS / App Service)
        - Telemetry & Guest Configuration (AMA, DCR, Ansible, Log generation)
        - Documentation & Guides
    validations:
      required: true
  - type: checkboxes
    id: contribution_interest
    attributes:
      label: Willingness to Contribute
      options:
        - label: I would like to help implement this and submit a Pull Request.
