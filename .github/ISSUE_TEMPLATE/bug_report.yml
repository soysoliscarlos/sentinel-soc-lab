name: Bug Report
description: Report a bug or failure in Terraform code, Ansible automation, telemetry, or deployment.
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report this issue in the SOC L2 Cyber Range.
        Please make sure NOT to include passwords, SSH private keys, Azure tokens, or confidential information.
  - type: input
    id: terraform_version
    attributes:
      label: Terraform Version
      description: Run `terraform version` and paste the output here.
      placeholder: "e.g., Terraform v1.9.0"
    validations:
      required: true
  - type: input
    id: azurerm_version
    attributes:
      label: AzureRM Provider Version
      placeholder: "e.g., hashicorp/azurerm = 5.10.0"
    validations:
      required: false
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Clearly and concisely describe what happened.
      placeholder: "Running terraform plan/apply produces the following error..."
    validations:
      required: true
  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the failure.
      value: |
        1. Configure variables in terraform.tfvars
        2. Run 'terraform init'
        3. Run 'terraform plan' or 'terraform apply'
        4. Observe the error
    validations:
      required: true
  - type: textarea
    id: logs_or_output
    attributes:
      label: Terminal Output / Error Logs
      description: Paste the relevant redacted error lines from Terraform, Ansible, or Azure CLI.
      render: shell
    validations:
      required: false
  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected Behavior
      description: Describe what you expected to happen instead.
    validations:
      required: false
  - type: checkboxes
    id: checkboxes
    attributes:
      label: Pre-submission Checks
      options:
        - label: I verified that I am NOT including secrets, private keys, or confidential data in this report.
          required: true
        - label: I searched existing Issues and confirmed this is not a duplicate report.
          required: true
